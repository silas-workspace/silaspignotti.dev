name: Bug report
description: Report something that does not work as described
title: "bug: "
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the failure. Include the affected site URL or route and the exact step or component that triggered it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: The shortest sequence that reproduces the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and device, plus Node.js and pnpm versions when the issue involves build or preview.
      placeholder: "e.g. Firefox 141 on macOS, Node 24, pnpm 11"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant — affected route, component, or content entry, logs, screenshots, related issues.
    validations:
      required: false
